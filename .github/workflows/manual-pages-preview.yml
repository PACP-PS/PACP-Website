name: PACP preview deployment (manual approval only)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type PACP-PREVIEW-APPROVED to authorize preview-only publication"
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    if: ${{ github.ref == 'refs/heads/rebuild/platform-foundation' && inputs.approval == 'PACP-PREVIEW-APPROVED' }}
    runs-on: ubuntu-latest
    environment: pacp-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical site assets
        run: python3 scripts/check_canonical_release.py
      - name: Verify original-site navigation
        run: python3 scripts/test_primary_navigation.py
      - name: Check static launch guardrails
        run: python3 scripts/prelaunch_static_check.py
      - name: Create public-only canonical site
        run: python3 scripts/build_public_preview.py
      - name: Publish isolated Cloudflare Pages branch preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/pacp-public-preview --project-name=pacp-website --branch=rebuild-platform-foundation --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
