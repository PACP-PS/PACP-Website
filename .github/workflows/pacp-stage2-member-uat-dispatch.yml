name: PACP stage-2 member login UAT (explicit approval, staging ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacp-stage2-member-uat-dispatch.yml'
  workflow_dispatch:
    inputs:
      approval:
        description: "Type PACP-STAGING-MEMBER-TEST to authorize staging-only test publication"
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approval == 'PACP-STAGING-MEMBER-TEST' }}
    runs-on: ubuntu-latest
    environment: pacp-preview
    timeout-minutes: 10
    steps:
      - name: Check out ONLY the development staging branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/platform-foundation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and assert Staging-only identity
        run: |
          python3 scripts/build_phase2_staging_login.py
          test -f build/pacp-phase2-staging/_headers
          test ! -f build/pacp-phase2-staging/.env
          ! grep -r -q 'lofvxgubetdslvaczvjp.supabase.co' build/pacp-phase2-staging
      - name: Deploy ONLY pacp-staging-v8 / member-login-uat
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/pacp-phase2-staging --project-name=pacp-staging-v8 --branch=member-login-uat --commit-dirty=true
