name: PACP stage-2 member login UAT (explicit approval, staging ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacp-stage2-member-uat-dispatch.yml'
  workflow_dispatch:
    inputs:
      approval:
        description: "Type PACP-STAGING-MEMBER-TEST to authorize staging-only test publication"
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approval == 'PACP-STAGING-MEMBER-TEST' }}
    runs-on: ubuntu-latest
    environment: pacp-preview
    timeout-minutes: 10
    steps:
      - name: Check out ONLY the development staging branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/platform-foundation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and assert Staging-only identity
        run: |
          python3 scripts/build_phase2_staging_login.py
          test -f build/pacp-phase2-staging/_headers
          test ! -f build/pacp-phase2-staging/.env
          ! grep -r -q 'lofvxgubetdslvaczvjp.supabase.co' build/pacp-phase2-staging
      - name: Check required Cloudflare credentials without displaying values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN_PREVIEW in pacp-preview or repository secrets"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in pacp-preview or repository secrets"
            exit 1
          fi
          echo "Required credentials are present (values not displayed)."
      - name: Confirm target is a preview branch and not production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects/pacp-staging-v8"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Cloudflare project lookup failed: HTTP " + str(error.code))
          if not result.get("success"):
              raise SystemExit("Cloudflare project verification failed.")
          project = result.get("result") or {}
          if project.get("name") != "pacp-staging-v8" or not project.get("production_branch") or project["production_branch"] == "member-login-uat":
              raise SystemExit("Refusing deployment: staging preview target not verified.")
          if any(str(d).lower().rstrip(".") in ("pacp.ps", "www.pacp.ps") for d in project.get("domains", [])):
              raise SystemExit("Refusing deployment: official domain assigned to target.")
          print("Verified target project and non-production branch.")
          PY
      - name: Deploy ONLY pacp-staging-v8 / member-login-uat
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/pacp-phase2-staging --project-name=pacp-staging-v8 --branch=member-login-uat --commit-dirty=true
