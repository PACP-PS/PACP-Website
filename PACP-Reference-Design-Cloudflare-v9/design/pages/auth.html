<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة الحساب | PACP Development</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{font-family:Alexandria,system-ui,sans-serif;color:#153d2f;background:#f3faf6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,540px);padding:30px;background:white;border:1px solid #dceee3;border-radius:25px;box-shadow:0 20px 65px #004a2714}header{text-align:center}header img{width:86px;height:86px;object-fit:contain}h1{font-size:23px;margin:14px 0 6px}p{font-size:13px;line-height:1.9;color:#64796e}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #b8d9c6;border-radius:11px;background:#eff8f2;padding:11px 14px;color:#135f3b}button.primary{background:#07653e;color:white;border-color:#07653e;width:100%;margin-top:12px}.tabs button[aria-pressed=true]{background:#07653e;color:white}label{display:block;font-size:13px;margin:15px 0 5px}input{font:inherit;width:100%;padding:12px;border:1px solid #c4d8cd;border-radius:11px;direction:ltr;text-align:left}input:focus{outline:2px solid #58a779}#status{min-height:45px;margin-top:15px;padding:10px;border-radius:10px;white-space:pre-wrap}#status:empty{display:none}.error{background:#fff1f0;color:#a31930}.ok{background:#e8f8ed;color:#07592f}#account{display:none}.small{font-size:11px}a{color:#07653e}
</style></head><body><main><header><img src="../../assets/pacp-logo-original.png" alt="الشعار الأصلي للجمعية الفلسطينية لاختصاصيي علم النفس العيادي"><h1>بوابة حساب العضو</h1><p>الجمعية الفلسطينية لاختصاصيي علم النفس العيادي</p><p class="small">بيئة تطوير تجريبية — لا تستخدم بيانات شخصية حقيقية الآن</p></header><div id="guest"><nav class="tabs" aria-label="خيارات الحساب"><button data-mode="login" aria-pressed="true">تسجيل الدخول</button><button data-mode="register" aria-pressed="false">حساب جديد</button><button data-mode="reset" aria-pressed="false">استعادة كلمة المرور</button></nav><form id="authForm"><label for="email">البريد الإلكتروني</label><input type="email" id="email" autocomplete="email" required><div id="passwordWrap"><label for="password">كلمة المرور</label><input type="password" id="password" minlength="10" autocomplete="current-password" required></div><button type="submit" class="primary" id="submit">تسجيل الدخول</button></form></div><div id="account"><p id="identity"></p><button id="loadSummary">عرض حالة عضويتي</button><button id="loadApplications">عرض طلباتي</button><button id="signout">تسجيل الخروج</button><div id="resetSection" hidden><label for="newPassword">كلمة مرور جديدة</label><input id="newPassword" type="password" minlength="10" autocomplete="new-password"><button id="savePassword">تحديث كلمة المرور</button></div></div><div id="status" role="status" aria-live="polite"></div><p class="small"><a href="../homepage-reference-matched.html">العودة إلى الصفحة الرئيسية</a></p></main><script type="module">
import {client,register,login,logout,sendReset,changePassword,mySummary,myApplications} from '../assets/pacp-supabase-auth.mjs';
let mode='login';let recoveryMode=false;const $=id=>document.getElementById(id);const status=(message,error=false)=>{const el=$('status');el.textContent=message;el.className=error?'error':'ok'};
const labels={login:'تسجيل الدخول',register:'إنشاء الحساب',reset:'إرسال رابط الاستعادة'};
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('passwordWrap').hidden=mode==='reset';$('password').required=mode!=='reset';$('password').autocomplete=mode==='register'?'new-password':'current-password';$('submit').textContent=labels[mode];$('status').textContent=''}));
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;$('submit').disabled=true;try{let result=mode==='register'?await register(email,password):mode==='login'?await login(email,password):await sendReset(email);if(result.error)throw result.error;status(mode==='register'?'إذا كان البريد مؤهلاً، ستصلك تعليمات تأكيد الحساب عند تفعيل خدمة الإرسال.':mode==='reset'?'إذا كان الحساب موجودًا، ستصلك تعليمات الاستعادة عند تفعيل البريد.':'تم تسجيل الدخول.');}catch(err){status('تعذر إتمام العملية. تحقق من الإعدادات أو بيانات الحساب.',true);console.error('Auth error:',err.message)}finally{$('submit').disabled=false}});
async function refresh(){const {data,error}=await client.auth.getUser();const user=error?null:data.user;$('guest').hidden=!!user;$('account').style.display=user?'block':'none';$('identity').textContent=user?'البريد المسجّل: '+user.email:'';const params=new URLSearchParams(location.search);$('resetSection').hidden=!(user&&recoveryMode);}
$('signout').onclick=async()=>{const {error}=await logout();if(error)status('تعذر تسجيل الخروج.',true);else{status('تم تسجيل الخروج.');await refresh()}};
$('loadSummary').onclick=async()=>{const {data,error}=await mySummary();status(error?'تعذر تحميل حالة العضوية.':data?JSON.stringify(data,null,2):'لا توجد عضوية معتمدة بعد.',!!error)};
$('loadApplications').onclick=async()=>{const {data,error}=await myApplications();status(error?'تعذر تحميل الطلبات.':JSON.stringify(data??[],null,2),!!error)};
$('savePassword').onclick=async()=>{if($('newPassword').value.length<10)return status('يجب ألا تقل كلمة المرور عن 10 أحرف.',true);const {error}=await changePassword($('newPassword').value);if(!error){recoveryMode=false;$('resetSection').hidden=true;history.replaceState({},'',location.pathname);$('newPassword').value='';}status(error?'تعذر تحديث كلمة المرور.':'تم تحديث كلمة المرور.',!!error)};
// PASSWORD_RECOVERY is emitted by Supabase when a valid recovery link is processed.
// The PKCE callback may instead return ?code=..., so detect the recovery
// intent using a dedicated callback query parameter set in sendReset().
client.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY') recoveryMode=true;
  if(event==='SIGNED_OUT') recoveryMode=false;
  setTimeout(refresh,0);
});
if(new URLSearchParams(location.search).get('pacp_recovery')==='1') recoveryMode=true;
await refresh();
</script></body></html>
